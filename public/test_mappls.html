<!DOCTYPE html>
<html>
<head>
  <script src="https://apis.mappls.com/advancedmaps/api/147df55152dfdc1a6acfbc7189a88b/map_sdk?layer=vector&v=3.0"></script>
</head>
<body>
  <div id="map" style="width: 100%; height: 500px;"></div>
  <script>
    function loadMap() {
      if (window.mappls) {
        console.log("Mappls loaded successfully!");
        var map = new mappls.Map('map', {center: [28.61, 77.23]});
      } else {
        console.log("Mappls failed to load.");
      }
    }
    window.onload = loadMap;
  </script>
</body>
</html>
